aid: havocai
name: HavocAI
description: HavocAI (Havoc) is a Providence, Rhode Island-based defense technology
  company building all-domain collaborative autonomy software and autonomous surface
  vessels for the U.S. Navy, U.S. Army and allied militaries. Its software suite pairs
  Havoc OS, an edge autonomy operating system for heterogeneous platforms, with Havoc
  C2 for one-to-many operator control, Havoc Insights for real-time sensor and telemetry
  analytics, and Havoc Connect, a resilient peer-to-peer overlay network for degraded
  or GPS-denied environments. The company builds the Rampage, Seahound, Kiakoa and
  Atlas autonomous surface vessels and is partnered with Hanwha on 200-foot ASVs. Enrichment
  probing in July 2026 found no public developer API, OpenAPI or other machine-readable
  contract, no developer portal or documentation, no published SDKs or packages, no
  MCP server, and no A2A agent card - the platform is delivered under defense contract
  rather than as a self-serve developer product.
